<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Signal Lost | Wenqi Huang</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <script>
    // Honour the theme chosen on the main site, before first paint
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* fall through to prefers-color-scheme */ }
    })();
  </script>
  <style>
    /* the site's self-hosted faces; absolute paths because this page answers any URL */
    @font-face { font-family: "Source Sans 3"; font-weight: 400 600; font-display: swap; src: url("/fonts/source-sans-3.woff2") format("woff2"); }
    @font-face { font-family: "Source Sans 3"; font-weight: 400 600; font-display: swap; src: url("/fonts/source-sans-3-arrows.woff2") format("woff2"); unicode-range: U+2190, U+2192, U+2197; }
    @font-face { font-family: "Source Serif 4"; font-weight: 400 500; font-display: swap; src: url("/fonts/source-serif-4.woff2") format("woff2"); }
    :root {
      --bg: #FAF8F4;
      --text: #24211D;
      --secondary: #5E5952;
      --accent: #A4552B;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1A1917;
        --text: #ECE7DF;
        --secondary: #B3ADA4;
        --accent: #E0A070;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1A1917;
      --text: #ECE7DF;
      --secondary: #B3ADA4;
      --accent: #E0A070;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Source Sans 3', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.06;
    }
    .content {
      position: relative;
      z-index: 1;
    }
    .error-code {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 6rem;
      font-weight: 500;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
      animation: glitchText 3s ease-in-out infinite;
    }
    @keyframes glitchText {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.3; transform: translateX(2px); }
      94% { opacity: 1; transform: translateX(-1px); }
      95% { opacity: 0.5; }
      96% { opacity: 1; transform: translateX(0); }
    }
    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--secondary);
      margin-bottom: 2rem;
      max-width: 400px;
    }
    .subtitle span {
      display: block;
      margin-top: 0.3rem;
    }
    a.home-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      padding: 0.6rem 1.5rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .error-code { animation: none; }
    }
    a.home-link:hover {
      background: var(--accent);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <canvas id="noise"></canvas>
  <div class="content">
    <div class="error-code">404</div>
    <h1>Signal Lost</h1>
    <p class="subtitle">
      The requested k-space data could not be found.
      <span>Possible causes: incorrect trajectory, missing phase-encoding lines, or the volunteer left the scanner.</span>
    </p>
    <a href="/" class="home-link">← Reconstruct from homepage</a>
  </div>

  <script>
    // Noise canvas — static MRI noise pattern
    (function() {
      const c = document.getElementById('noise');
      const ctx = c.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      // noise is per device pixel; putImageData ignores transforms, so fill the whole backing store
      function draw() {
        const w = window.innerWidth, h = window.innerHeight;
        c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
        c.style.width = w + 'px'; c.style.height = h + 'px';
        const imageData = ctx.createImageData(c.width, c.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const v = Math.random() * 255;
          data[i] = data[i+1] = data[i+2] = v;
          data[i+3] = 30;
        }
        ctx.putImageData(imageData, 0, 0);
      }
      draw();
      window.addEventListener('resize', draw);
    })();
  </script>
</body>
</html>
